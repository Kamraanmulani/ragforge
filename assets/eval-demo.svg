<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Real output of npx ragforge eval on 12 npm package READMEs: plain search matched or beat every query technique">
  <title>npx ragforge eval (real run on 12 npm package READMEs)</title>
  <style>
    text { font: 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; white-space: pre; }
    .dim { fill: #6e7681; }
    .prompt { fill: #7ee787; }
    .cmd { fill: #f0f6fc; font-weight: 600; }
    .head { fill: #8b949e; font-weight: 600; }
    .best { fill: #f0f6fc; font-weight: 600; }
    .star { fill: #fbbf24; }
    .good { fill: #7ee787; }
    .accent { fill: #a5b4fc; }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="498" rx="14" fill="url(#edge)"/>
  <rect x="3" y="3" width="894" height="494" rx="12" fill="#0d1117"/>
  <rect x="3" y="3" width="894" height="40" rx="12" fill="#161b22"/>
  <rect x="3" y="31" width="894" height="12" fill="#161b22"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="23" r="6" fill="#febc2e"/>
  <circle cx="66" cy="23" r="6" fill="#28c840"/>
  <text x="450" y="27.5" text-anchor="middle" class="dim">ragforge eval</text>

  <text x="28" y="78"><tspan class="prompt">$</tspan> <tspan class="cmd">npx ragforge eval --docs ./readmes --questions 30 --techniques baseline,hyde,stepback,fanout,hyde+stepback</tspan></text>
  <text x="28" y="106" class="dim">Evaluating 12 document(s) with openai...</text>
  <text x="28" y="126" class="dim">Indexing chunks: 437/437</text>
  <text x="28" y="146" class="dim">Generating questions: 30/30</text>
  <text x="28" y="166" class="dim">Running techniques: 150/150</text>

  <text x="28" y="202" class="accent">ragforge eval · 30 questions · top 5 · openai gpt-4o-mini / text-embedding-ada-002</text>

  <text x="28" y="234" class="head">technique       hit@5   MRR     latency   cost/query   LLM calls   errors</text>
  <text x="28" y="254" class="dim">-------------   -----   -----   -------   ----------   ---------   ------</text>
  <!-- Name and values drawn separately so the wide ★ glyph can't shift the columns -->
  <text x="28" y="278"><tspan class="best">baseline</tspan> <tspan class="star">★</tspan></text>
  <text x="28" y="278">                <tspan class="good">77%</tspan>     <tspan class="good">0.672</tspan>   <tspan class="good">407ms</tspan>     <tspan class="good">$0.000001</tspan>    0</text>
  <text x="28" y="300">stepback        77%     0.569   2.1s      $0.000021    1</text>
  <text x="28" y="322">fanout          77%     0.555   2.2s      $0.000049    1</text>
  <text x="28" y="344">hyde+stepback   77%     0.539   6.6s      $0.000374    2</text>
  <text x="28" y="366">hyde            67%     0.528   6.7s      $0.000352    1</text>

  <text x="28" y="402"><tspan class="star">★</tspan> <tspan class="best">Recommended: baseline</tspan></text>
  <text x="28" y="422">  Plain embedding search had the best hit@5 (77%); query techniques didn't help on this data.</text>
  <text x="28" y="442" class="dim">Setup: 437 chunks indexed, 30 questions, setup cost $0.009390</text>

  <text x="28" y="474"><tspan class="prompt">$</tspan> <tspan class="cmd">▍</tspan></text>
</svg>
