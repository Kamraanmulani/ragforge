<svg xmlns="http://www.w3.org/2000/svg" width="480" height="112" viewBox="0 0 480 112" role="img" aria-label="ragforge">
  <title>ragforge</title>
  <style>
    .word { fill: #111827; font: 700 54px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
    .forge { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #f9fafb; }
      .forge { fill: #a5b4fc; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark: three queries fused into one result -->
  <rect x="8" y="8" width="96" height="96" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M28 34 C 48 34, 56 56, 72 56" stroke-opacity="0.75"/>
    <path d="M28 56 L 72 56"/>
    <path d="M28 78 C 48 78, 56 56, 72 56" stroke-opacity="0.75"/>
  </g>
  <circle cx="78" cy="56" r="16" fill="url(#glow)"/>
  <path d="M78 44 L81 53 L90 56 L81 59 L78 68 L75 59 L66 56 L75 53 Z" fill="#ffffff"/>

  <!-- Wordmark -->
  <text x="128" y="75" class="word">rag<tspan class="forge">forge</tspan></text>
</svg>
